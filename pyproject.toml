[build-system]
requires = [
    "setuptools",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "service-trocr-inference"
version = "0.1.0"
description = "FastAPI service for TrOCR inference"
readme = { file = "README.md", content-type = "text/markdown" }

authors = [
    { name = "Dana Rebecca Meyer", email = "dameyer@techfak.uni-bielefeld.de" },
    { name = "Jonas Widmer", email = "jonas.widmer@unibe.ch" }
]

requires-python = ">=3.12"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "MIT"

dependencies = [
    "celery>=5.4.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.109.1",
    "flow-inference",
    "loguru>=0.7.3",
    "pydantic>=2.11.4",
    "pydantic-core>=2.14,<3",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.0",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.37,<0.39",
    "torch>=2.6",
    "torchvision>=0.19",
]

keywords = [
    "flow-project",
    "inference",
    "evaluation",
    "htrflow",
    "digital-humanities",
    "htr",
    "handwritten-text-recognition",
    "datasets",
    "huggingface",
    "nlp",
    "machine-learning",
    "trocr",
    "transformers",
    "fastapi"
]

[tool.setuptools.packages]
find = { where = ["src"] }

[project.urls]
Homepage = "https://flow-project.net"
Repository = "https://github.com/The-Flow-Project/service-trocr-inference"

# ------------------------------------------------------------------
# uv: external Flow packages
# ------------------------------------------------------------------
[tool.uv.sources]
flow-inference = { git = "https://github.com/The-Flow-Project/package-trocr-inference.git" }
