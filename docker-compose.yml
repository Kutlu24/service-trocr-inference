services:
  # ── Redis (message broker + status storage) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: inference-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI service ────────────────────────────────────────────────
  trocr-inference:
    image: service-trocr-inference:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-cpu
      args:
        TORCH_VARIANT: cpu
    container_name: service-trocr-inference
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - redis_url=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery worker ──────────────────────────────────────────────────
  celery-worker:
    image: service-trocr-inference:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-cpu
      args:
        TORCH_VARIANT: cpu
    container_name: inference-celery-worker
    command: celery -A app.celery_app.celery_app worker --loglevel=${LOG_LEVEL:-INFO} --concurrency=1
    env_file:
      - .env
    environment:
      - redis_url=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "test -d /proc/1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  redis-data:
    driver: local

networks:
  default:
    name: inference-network